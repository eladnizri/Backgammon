<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שש-בש — עם דירוג מהלכים</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div class="top-group">
    <button id="new-game" class="icon-btn" title="משחק חדש" aria-label="משחק חדש">
      <span class="icon-glyph">🔄</span>
    </button>
  </div>

  <div class="brand">שש-בש <span class="sub">מאמן אישי</span></div>

  <div class="top-group">
    <label class="pill lvl-pill" title="רמת קושי">
      <select id="level">
        <option value="easy">קלה</option>
        <option value="medium" selected>בינונית</option>
        <option value="hard">קשה</option>
      </select>
      <span class="pill-arrow">▾</span>
    </label>
    <button id="avg-chip" class="icon-btn" title="לחץ לסיכום ביניים — ממוצע דירוג המהלכים">
      <span class="icon-glyph">📊</span>
      <span class="badge" id="avg-badge">—</span>
    </button>
  </div>
</header>

<main>
  <div id="status-bar"><span id="status-text"></span></div>

  <div id="board-wrap">
    <div id="board" dir="ltr"></div>
  </div>

  <div id="action-bar">
    <span class="pill pip-pill">
      <span class="pip-label">אתה</span><b id="pip-white">167</b>
    </span>

    <button id="roll-btn" class="fab" title="הטל קוביות" aria-label="הטל קוביות">
      <span class="icon-glyph">🎲</span>
    </button>

    <span class="pill pip-pill">
      <span class="pip-label">מחשב</span><b id="pip-black">167</b>
    </span>

    <button id="undo-btn" class="btn" hidden>↩ בטל מהלך</button>
    <button id="confirm-btn" class="btn confirm big" hidden>סיים תור ✓</button>
  </div>
</main>

<div id="toast" hidden>
  <div id="toast-score" class="score-badge">—</div>
  <div class="toast-body">
    <div id="toast-grade" class="toast-grade"></div>
    <div id="toast-expl" class="toast-expl"></div>
    <div id="toast-best" class="toast-best"></div>
  </div>
</div>

<div id="modal-backdrop" hidden>
  <div id="modal"></div>
</div>

<script src="js/rules.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
