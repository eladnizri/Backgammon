<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שש-בש — עם דירוג מהלכים</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div class="brand">🎲 שש-בש <span class="sub">עם מאמן אישי</span></div>
  <div class="controls">
    <label class="lvl-label">רמת קושי
      <select id="level">
        <option value="easy">קלה</option>
        <option value="medium" selected>בינונית</option>
        <option value="hard">קשה</option>
      </select>
    </label>
    <button id="avg-chip" class="chip" title="לחץ לסיכום ביניים">ממוצע מהלכים: —</button>
    <button id="new-game" class="btn">משחק חדש</button>
  </div>
</header>

<main>
  <div id="status-bar"><span id="status-text"></span></div>

  <div id="board-wrap">
    <div id="board" dir="ltr"></div>
  </div>

  <div id="action-bar">
    <button id="roll-btn" class="btn primary big">הטל קוביות 🎲</button>
    <button id="undo-btn" class="btn" hidden>↩ בטל מהלך</button>
    <button id="confirm-btn" class="btn confirm big" hidden>סיים תור ✓</button>
    <span id="pip-row">
      <span class="pip-chip">אתה: <b id="pip-white">167</b></span>
      <span class="pip-chip">מחשב: <b id="pip-black">167</b></span>
    </span>
  </div>
</main>

<div id="toast" hidden>
  <div id="toast-score" class="score-badge">—</div>
  <div class="toast-body">
    <div id="toast-grade" class="toast-grade"></div>
    <div id="toast-expl" class="toast-expl"></div>
    <div id="toast-best" class="toast-best"></div>
  </div>
</div>

<div id="modal-backdrop" hidden>
  <div id="modal"></div>
</div>

<script src="js/rules.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
