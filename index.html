<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0d11">
<title>שש-בש — מאמן אישי</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header id="topbar">
    <button id="menu-btn" class="ghost-btn" aria-label="תפריט">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <div class="title">שש-בש<span class="title-sub">מאמן אישי</span></div>

    <button id="avg-chip" class="stat-chip" aria-label="סיכום מהלכים">
      <span class="stat-num" id="avg-badge">—</span>
      <span class="stat-cap">ציון</span>
    </button>
  </header>

  <!-- יריב -->
  <section class="strip" id="strip-ai">
    <div class="who">
      <span class="avatar b">🤖</span>
      <span class="nm">מחשב</span>
    </div>
    <div class="borne" id="borne-black"></div>
    <div class="pipbox"><b id="pip-black">167</b><span>פיפ</span></div>
  </section>

  <section id="board-area">
    <div id="board" dir="ltr"></div>
  </section>

  <!-- שחקן -->
  <section class="strip" id="strip-me">
    <div class="who">
      <span class="avatar w">🙂</span>
      <span class="nm">אתה</span>
    </div>
    <div class="borne" id="borne-white"></div>
    <div class="pipbox"><b id="pip-white">167</b><span>פיפ</span></div>
  </section>

  <footer id="dock">
    <div id="feedback">
      <div id="status-text"></div>
      <div id="rating" hidden>
        <div id="rating-score" class="score-ring">—</div>
        <div class="rating-body">
          <div id="rating-grade"></div>
          <div id="rating-expl"></div>
          <div id="rating-best"></div>
        </div>
      </div>
    </div>
    <div id="actions">
      <button id="undo-btn" class="pill-btn" hidden>
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
        בטל
      </button>
      <button id="roll-btn" class="roll-btn" aria-label="הטל קוביות">
        <span class="roll-face"></span>
      </button>
    </div>
  </footer>

</div>

<div id="sheet-backdrop" hidden>
  <div id="sheet">
    <div class="grabber"></div>
    <h3>הגדרות</h3>

    <div class="row">
      <span class="row-lbl">רמת קושי</span>
      <div class="seg" id="level-seg">
        <button data-v="easy">קלה</button>
        <button data-v="medium" class="on">בינונית</button>
        <button data-v="hard">קשה</button>
      </div>
    </div>

    <div class="row">
      <span class="row-lbl">צלילים</span>
      <button class="toggle on" id="sound-toggle" role="switch" aria-checked="true"><i></i></button>
    </div>

    <div class="row">
      <span class="row-lbl">רמזים על הלוח</span>
      <button class="toggle on" id="hint-toggle" role="switch" aria-checked="true"><i></i></button>
    </div>

    <div class="sheet-actions">
      <button class="pill-btn wide" id="sheet-stats">סיכום המהלכים</button>
      <button class="pill-btn wide gold" id="sheet-new">משחק חדש</button>
    </div>
  </div>
</div>

<div id="modal-backdrop" hidden>
  <div id="modal"></div>
</div>

<script src="js/rules.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
